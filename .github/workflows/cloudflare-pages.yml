name: Cloudflare Pages

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  release:
    needs: checks
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify existing hosts require Access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCESS_EXTRA_HOSTS: ${{ vars.CLOUDFLARE_ACCESS_EXTRA_HOSTS }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/cloudflare-access-check.mjs
      - name: Install pinned Wrangler
        if: github.event_name == 'push'
        run: npm install --prefix "$RUNNER_TEMP/omnia-wrangler" --no-audit --no-fund --package-lock=false wrangler@4.152.0
      - name: Deploy V2 production
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: >-
          "$RUNNER_TEMP/omnia-wrangler/node_modules/.bin/wrangler"
          pages deploy dist --project-name omnia-web --branch master
          --commit-hash "${{ github.sha }}" --commit-dirty=false
      - name: Verify new production deployment requires Access
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCESS_EXTRA_HOSTS: ${{ vars.CLOUDFLARE_ACCESS_EXTRA_HOSTS }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/cloudflare-access-check.mjs

  preview:
    needs: checks
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: cloudflare-preview
      url: https://pr-${{ github.event.number }}.omnia-web-bae.pages.dev
    env:
      PREVIEW_BRANCH: pr-${{ github.event.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify preview alias and wildcard before upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/cloudflare-preview-check.mjs "$PREVIEW_BRANCH"
      - name: Install pinned Wrangler
        run: npm install --prefix "$RUNNER_TEMP/omnia-wrangler" --no-audit --no-fund --package-lock=false wrangler@4.152.0
      - name: Deploy V2 preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: >-
          "$RUNNER_TEMP/omnia-wrangler/node_modules/.bin/wrangler"
          pages deploy dist --project-name omnia-web --branch "$PREVIEW_BRANCH"
          --commit-hash "${{ github.event.pull_request.head.sha }}" --commit-dirty=false
      - name: Verify resulting preview deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/cloudflare-preview-check.mjs "$PREVIEW_BRANCH" --uploaded
          echo "Verified private preview: https://$PREVIEW_BRANCH.omnia-web-bae.pages.dev" >> "$GITHUB_STEP_SUMMARY"
