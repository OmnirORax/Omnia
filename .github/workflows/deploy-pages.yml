name: Legacy Pages build checks (publication disabled)

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.event.pull_request.number || github.ref }}
  # New PR commits supersede stale checks; never interrupt master releases.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Yarn
        run: |
          npm install --prefix "$RUNNER_TEMP/omnia-yarn" --no-audit --no-fund --package-lock=false @yarnpkg/cli-dist@4.18.1
          echo "$RUNNER_TEMP/omnia-yarn/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install dependencies from lockfile
        run: yarn install --immutable
      - name: Test graph model
        run: yarn test
      - name: Typecheck and build
        env:
          # Public repository variables only; elevated keys never enter this build.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: yarn build

      # Publication retired for the private Cloudflare migration.
      # The previously published site must also be unpublished in GitHub Settings.
