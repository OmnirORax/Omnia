name: Windows audio helper
on:
  pull_request:
    branches: [master]
    paths: ['native/audio-helper/**', 'src/scene/native*.ts', 'tests/system-audio*', '.github/workflows/audio-helper.yml']
  push:
    branches: [master]
    paths: ['native/audio-helper/**', 'src/scene/native*.ts', 'tests/system-audio*', '.github/workflows/audio-helper.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audio-helper-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  windows-helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install helper dependencies
        run: python -m pip install -r native/audio-helper/requirements.txt
      - name: Test local protocol and mocked device recovery
        run: python -m unittest discover -s native/audio-helper -p "test_*.py"
      - name: Build standalone helper
        shell: pwsh
        run: ./native/audio-helper/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Omnium-Audio-Helper-Windows
          path: |
            native/audio-helper/dist/Omnium-Audio-Helper.exe
            native/audio-helper/dist/THIRD_PARTY_LICENSES.txt
            native/audio-helper/dist/README.md
            native/audio-helper/dist/ThirdPartyLicenses/
