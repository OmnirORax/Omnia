<!doctype html><html><body>
<button id="connect">Connect synthetic helper</button><button id="stop">Stop</button><output id="status"></output>
<script type="module">
import * as audio from '../src/scene/audio.ts';
import {DEFAULT_SCENE_VFX} from '../src/scene/vfx.ts';
window.audioProbe={audio,settings:{...DEFAULT_SCENE_VFX}};
document.querySelector('#connect').onclick=()=>audio.connectSceneSystemAudio().catch(error=>{window.audioProbe.error=error.message;});
document.querySelector('#stop').onclick=()=>audio.stopSceneAudio();
audio.subscribeSceneAudio(()=>document.querySelector('#status').textContent=audio.sceneAudioStatus());
</script></body></html>
