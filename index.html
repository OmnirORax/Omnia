<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101113" />
    <meta name="description" content="Omnium — a structural workbench in three dimensions." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Omnium</title>
  </head>
  <body>
    <main id="world" aria-label="3D structural workbench"></main>
    <header>
      <span class="wordmark">omnium <small>v2</small></span>
      <button id="create" title="Create a structure" aria-label="Create a structure">+</button>
      <input id="find" type="search" placeholder="Find…" aria-label="Find structures" title="Filter structures; Enter selects matches" autocomplete="off" />
      <button id="undo" title="Undo · Ctrl/⌘ Z" aria-label="Undo">↶</button>
      <button id="redo" title="Redo · Ctrl/⌘ Shift Z" aria-label="Redo">↷</button>
    </header>
    <div id="empty">Create a structure with <span>+</span></div>
    <output id="status" aria-live="polite"></output>
    <div id="tools" role="dialog" aria-label="Contextual operations" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
